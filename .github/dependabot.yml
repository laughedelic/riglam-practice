version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Bumped by hand (docs/TESTING.md): a new release changes the browser the specs run in, and it has to support the operating system of CI's ubuntu-latest.
      - dependency-name: "@playwright/test"
      # typescript-eslint supports TypeScript up to 6.0 and the unit tests use the TypeScript 6 compiler API; move to 7 by hand once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node version in .nvmrc (22); the v26 types also clash with @cloudflare/workers-types in the worker typecheck.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
