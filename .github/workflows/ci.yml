name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.149.0

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Decrypts the course part of the term data for the artifact build and the tests (docs/DATA.md). The PWA build does not need it.
      RIGLAM_DATA_KEY: ${{ secrets.RIGLAM_DATA_KEY }}
    steps:
      - name: Data key present?
        run: |
          if [ -z "$RIGLAM_DATA_KEY" ]; then
            echo "::error::The repository secret RIGLAM_DATA_KEY is not set (or not available to this run, as for Dependabot: add it under Dependabot secrets too). See docs/DATA.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check the hosting config
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Only the PWA build is kept: it holds the encrypted definitions. The artifact build holds them in the clear, so it is not uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: dist/pwa/
          retention-days: 14

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, and release-please reads it to pick the next version.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Preview of the PWA for every pull request, and a "staging" alias that follows main.
  # Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/DEPLOY.md); without them the job only says so.
  deploy-preview:
    name: Deploy preview
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'staging' }}
      # On pull requests GITHUB_SHA is a merge commit that is not on the branch; label previews with the head commit.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Credentials present?
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Preview skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (see docs/DEPLOY.md)"; fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok
        with:
          name: pwa-build
          path: dist/pwa
      - name: Upload a version with a preview alias
        id: upload
        if: steps.creds.outputs.ok
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} versions upload --preview-alias "$ALIAS" --message "${BUILD_SHA::7}" | tee upload.log
          url=$(grep -Eo 'https://[^ ]+' upload.log | grep -i "$ALIAS" | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview address on the pull request
        if: steps.creds.outputs.ok && github.event_name == 'pull_request' && steps.upload.outputs.url
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- riglam-preview -->';
            const body = `${marker}\nPreview of this pull request: ${process.env.PREVIEW_URL}\n\nBuilt from ${process.env.BUILD_SHA.slice(0, 7)}. Add the data key to the address (\`#k=...\`) to unlock the definitions; the key is not kept here.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
