name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request replaces its run. Every commit on main keeps a run of its own, so a merge that follows closely does not cancel the verdict on the one before.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.149.0

jobs:
  # The checks that need no browser: lint, types, both builds, the unit tests and the hosting config.
  static:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Made-up definitions and notes for every term (docs/DATA.md): CI never holds the real course data, so nothing real can reach a log or a report.
      - run: npm run data:fixture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Check the hosting config
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run

  # The browser tests, in parallel. Each job builds both outputs itself (about 10 seconds), because the artifact build must not be uploaded.
  # Playwright's --shard cuts a project's tests into equal runs of consecutive tests (by count, not by time), which is even enough here.
  # Each job has about 30 seconds of setup. Measured on a run: the slowest legacy slice takes about 3 minutes (test40q alone is about two), the slowest PWA slice
  # about 3.5, so a fourth slice of each PWA project would save under a minute.
  # When a project or a shard is added here, `npx playwright test --list` must still list every test exactly once across the jobs (docs/TESTING.md).
  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: legacy 1/3, args: "--project=legacy --shard=1/3" }
          - { name: legacy 2/3, args: "--project=legacy --shard=2/3" }
          - { name: legacy 3/3, args: "--project=legacy --shard=3/3" }
          - { name: layout, args: "--project=layout" }
          - { name: PWA desktop 1/3, args: "--project=pwa-desktop --shard=1/3" }
          - { name: PWA desktop 2/3, args: "--project=pwa-desktop --shard=2/3" }
          - { name: PWA desktop 3/3, args: "--project=pwa-desktop --shard=3/3" }
          - { name: PWA phone 1/3, args: "--project=pwa-phone --shard=1/3" }
          - { name: PWA phone 2/3, args: "--project=pwa-phone --shard=2/3" }
          - { name: PWA phone 3/3, args: "--project=pwa-phone --shard=3/3" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Made-up definitions and notes for every term (docs/DATA.md): CI never holds the real course data, so nothing real can reach a log or a report.
      - run: npm run data:fixture
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No --with-deps: the runner image already has every library Chromium needs (it only lacked fonts for scripts the app does not show), and the apt-get that
      # --with-deps runs has stalled for minutes on a slow package mirror. If the image ever loses a library, Playwright says so when it starts the browser.
      - run: npx playwright install chromium
      # Nothing from this step is uploaded: the HTML report and the traces record page content and step arguments (URLs, typed text),
      # which can include the course definitions and the data key, and artifacts (unlike logs) are not masked.
      # Read a failure in this job's log, or run the spec locally with `--trace on`.
      - run: npx playwright test ${{ matrix.args }}

  # One check for the whole suite, under the name that branch protection requires (docs/RELEASING.md), whatever the jobs above are called or however many there are.
  check:
    name: Lint, build, test
    needs: [static, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every part pass?
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "static: $STATIC, browser: $BROWSER"
          [ "$STATIC" = success ] && [ "$BROWSER" = success ]
