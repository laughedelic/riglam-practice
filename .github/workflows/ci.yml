name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# (trial edit of a workflow file, to be reverted)
permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.149.0

jobs:
  # The checks that need no browser: lint, types, both builds, the unit tests and the hosting config.
  static:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Made-up definitions and notes for every term (docs/DATA.md): CI never holds the real course data, so nothing real can reach a log or a report.
      - run: npm run data:fixture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Check the hosting config
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run

  # The browser tests, in parallel. Each job builds both outputs itself (about 10 seconds), because the artifact build must not be uploaded.
  # The legacy suite is the long part (test40q alone takes about two minutes), so it is split with Playwright's --shard; layout and PWA specs share one job.
  # When a project or a shard is added here, `npx playwright test --list` must still list every test exactly once across the jobs (docs/TESTING.md).
  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: legacy 1/3, args: "--project=legacy --shard=1/3" }
          - { name: legacy 2/3, args: "--project=legacy --shard=2/3" }
          - { name: legacy 3/3, args: "--project=legacy --shard=3/3" }
          - { name: layout and PWA, args: "--project=layout --project=pwa-desktop --project=pwa-phone" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Made-up definitions and notes for every term (docs/DATA.md): CI never holds the real course data, so nothing real can reach a log or a report.
      - run: npm run data:fixture
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Nothing from this step is uploaded: the HTML report and the traces record page content and step arguments (URLs, typed text),
      # which can include the course definitions and the data key, and artifacts (unlike logs) are not masked.
      # Read a failure in this job's log, or run the spec locally with `--trace on`.
      - run: npx playwright test ${{ matrix.args }}

  # One check for the whole suite, under the name that branch protection requires (docs/RELEASING.md), whatever the jobs above are called or however many there are.
  check:
    name: Lint, build, test
    needs: [static, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every part pass?
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "static: $STATIC, browser: $BROWSER"
          [ "$STATIC" = success ] && [ "$BROWSER" = success ]

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, and release-please reads it to pick the next version.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
