name: Retire preview

# ci.yml shows every preview as a deployment in its own GitHub environment, preview/pr-<number>. When the pull request is merged
# or closed, its deployments are marked inactive, so none shows as live after the preview is no longer wanted. They are kept,
# so the pull request still shows what was deployed. The environment stays in the repository's settings: removing it is an
# administration action that the workflow token cannot have (docs/DEPLOY.md). The Cloudflare preview address is not touched.

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  retire:
    name: Retire the preview of the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark the deployments inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: preview/pr-${{ github.event.number }}
        run: |
          set -o pipefail
          gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/deployments" -f environment="$ENVIRONMENT" --jq '.[].id' |
            while read -r id; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -f description="The pull request was closed" --silent
              echo "Deployment $id of $ENVIRONMENT is inactive"
            done
