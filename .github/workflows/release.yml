name: Release

# release-please keeps one open "release" pull request that collects the conventional commits merged to main
# (feat: and fix: choose the version; the notes go into the pull request and the GitHub release, there is no changelog
# file). Merging that pull request tags the release; the job below then attaches the PWA build to it. Production is not
# deployed from here: the Cloudflare Workers Builds trigger on main deploys it, filtered on .release-please-manifest.json so
# that only the merge of a release pull request starts it (docs/DEPLOY.md).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A pull request opened with the default token does not start CI. Set RELEASE_PLEASE_TOKEN
          # (a fine-grained token with contents and pull-requests write) to get checks on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Attach the PWA build to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The PWA build needs no course data: the definitions come from the server. The artifact build holds them
      # in the clear, so it is neither built nor attached here (publish it from a machine that has the data, docs/ARTIFACT-LOOP.md).
      - run: npm run build:pwa
      - name: Attach the PWA build to the release
        run: |
          (cd dist/pwa && zip -qr "../../riglam-practice-pwa-${TAG}.zip" .)
          gh release upload "$TAG" "riglam-practice-pwa-${TAG}.zip" --clobber
