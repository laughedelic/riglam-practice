name: Release

# release-please keeps one open "release" pull request that collects the conventional commits merged to main
# (feat: and fix: choose the version, CHANGELOG.md is written for you). Merging that pull request tags the
# release; the jobs below then attach the builds to it and put the PWA on the production address.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  WRANGLER_VERSION: 4.149.0

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A pull request opened with the default token does not start CI. Set RELEASE_PLEASE_TOKEN
          # (a fine-grained token with contents and pull-requests write) to get checks on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Attach the PWA build and deploy production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The PWA build needs no data key: its definitions are the encrypted file from the repository. The artifact build holds them
      # in the clear, so it is neither built nor attached here (publish it from a machine that has the key, docs/ARTIFACT-LOOP.md).
      - run: npm run build:pwa
      - name: Attach the PWA build to the release
        run: |
          (cd dist/pwa && zip -qr "../../riglam-practice-pwa-${TAG}.zip" .)
          gh release upload "$TAG" "riglam-practice-pwa-${TAG}.zip" --clobber
      - name: Deploy the PWA to production
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Production deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (see docs/DEPLOY.md)"
          else
            npx --yes wrangler@${WRANGLER_VERSION} deploy --message "$TAG"
          fi
