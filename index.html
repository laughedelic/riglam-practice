<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10162b" media="(prefers-color-scheme: dark)">
<meta name="description" content="Practice in logic and debate: pick the relation between two phenomena and give examples for each combination.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Dudra practice</title>
</head>
<body>
<!--@markup-->
<script>
// A way out of a start that never finishes. If the page still says "Loading." (or that the data could not be loaded) after a while, because
// the scripts or the data did not arrive, offer a plain reload and a reload that first drops the service worker and its cached files. Answers
// and settings are in IndexedDB and localStorage, which this never touches. Inline on purpose: it must run when the app's own script does not.
(function () {
  var after = window.__riglamRecoverMs || 12000, t0 = Date.now(), box = null, timer;
  function stuck() {
    var s = document.querySelector("#stage .status"), t = (s && s.textContent) || "";
    return t.indexOf("Loading.") === 0 || t.indexOf("The practice data could not be loaded") === 0;
  }
  function fresh() {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  }
  function button(label, run) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.addEventListener("click", run);
    b.style.cssText = "height:40px;margin:0 8px 8px 0;padding:0 16px;border:1.5px solid #4d5260;background:#fff;color:#000;font:15px sans-serif";
    return b;
  }
  function show() {
    box = document.createElement("div");
    box.id = "recover"; box.setAttribute("role", "alert");
    box.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:40;box-sizing:border-box;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;border-top:2px solid #4d5260;font:15px/1.4 sans-serif";
    var p = document.createElement("p"), n = document.createElement("p");
    p.style.margin = "0 0 10px"; n.style.cssText = "margin:0;font-size:13px";
    p.textContent = "The app is taking longer than usual to start.";
    n.textContent = "Reloading with fresh files keeps your answers and settings; only the saved copy of the app itself is replaced.";
    box.append(p, button("Reload", function () { location.reload(); }), button("Reload with fresh files", fresh), n);
    document.body.append(box);
  }
  timer = setInterval(function () {
    if (stuck()) { if (!box && Date.now() - t0 > after) show(); return; }
    clearInterval(timer);
    if (box) box.remove();
  }, 1000);
})();
</script>
<script type="module" src="/src/entry-pwa.ts"></script>
</body>
</html>
