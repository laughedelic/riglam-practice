<!-- The cover of the installed app: what the page shows from its first paint, while the scripts and the data arrive, and what leaves (src/pwa/cover.ts) once the first screen is drawn.
     It stands before any stylesheet or script of the app has loaded: its style is in this file, and two small scripts below draw it for the size of the screen. It is the cover picked in the
     Design Lab: the figure with the Hero's grain on its shapes, the blue diamond sliding up into the gold one, the name in the Hero's face (the roadmap's lockup, src/app/path/brand.tsx: when the
     form changes there, change it here), and the path through the screen, solid above the figure and dotted under it, which leaves a gap for the name. cover.ts then flies the figure and the name
     into their places at the head of the roadmap. -->
<style>
.cover{--cv-paper:#fbf9f2;--cv-ink:#14151c;--cv-ink2:#6a6a6c;position:fixed;inset:0;z-index:20;overflow:hidden;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--cv-paper);color:var(--cv-ink);transition:opacity .38s ease,background-color var(--cv-t,0ms) ease var(--cv-td,0ms)}
@media (prefers-color-scheme:dark){.cover{--cv-paper:#161a20;--cv-ink:#ece7dc;--cv-ink2:#a39f96}}
.cover[data-mode="light"]{--cv-paper:#fbf9f2;--cv-ink:#14151c;--cv-ink2:#6a6a6c}
.cover[data-mode="dark"]{--cv-paper:#161a20;--cv-ink:#ece7dc;--cv-ink2:#a39f96}
.cover.gone{opacity:0;pointer-events:none}
.cover svg{position:absolute;overflow:visible}
.cover .cv-line{left:0;top:0}
.cover .cv-ln line{stroke:var(--cv-ink);stroke-opacity:.8;stroke-width:2.5}
.cover .cv-ln .dots{stroke-linecap:round;stroke-dasharray:.1 8.1}
.cover .cv-gap{animation:cv-fadein .7s 1.1s ease backwards}
.cover .cv-fig g{isolation:isolate}
.cover .cv-fig .d2,.cover .cv-fig .d3{animation:cv-slide 1s .3s cubic-bezier(.3,.7,.2,1) backwards}
.cover .cv-gr{mix-blend-mode:soft-light}
.cover .cv-name{animation:cv-fade .7s 1.1s ease backwards}
.cover .cv-name text{font-family:'Sorts Mill Goudy','EB Garamond',Georgia,serif;font-weight:400}
.cover .cv-name .n{font-size:20.5px;letter-spacing:.08em;fill:var(--cv-ink)}
.cover .cv-name .p{font-style:italic;font-size:23.83px;letter-spacing:.1em;fill:var(--cv-ink2)}
.cover .cv-name tspan{letter-spacing:0}
/* the cover flies into the roadmap (cover.ts): the path and the grain go first, the ground and the words' colors as it moves, and at the end the figure and the name fade out over the roadmap's own */
.cover.zm .cv-line{opacity:0;transition:opacity calc(var(--cv-s,0ms) * .3) ease}
.cover.zm .cv-gr{opacity:0;transition:opacity calc(var(--cv-s,0ms) * .4) ease}
.cover .cv-name text{transition:fill var(--cv-s,0ms) ease}
.cover.out .cv-fig,.cover.out .cv-name{opacity:0;transition:opacity .16s ease}
@keyframes cv-slide{from{transform:translateY(var(--d))}to{transform:translateY(0)}}
@keyframes cv-fadein{from{opacity:0}}
@keyframes cv-fade{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.cover,.cover *{animation:none!important;transition:none!important}}
</style>
<div class="cover" id="cover" role="status" aria-label="Riglam practice is starting"></div>
<script id="cover-look">try{var m=JSON.parse(localStorage.getItem("rd-look")||"null");if(m&&(m.mode==="light"||m.mode==="dark"))document.getElementById("cover").setAttribute("data-mode",m.mode)}catch(e){}</script>
<!-- The Hero's grain: the noise tile of scripts/lib/grain.mjs (fineNoiseTile), made here so that the page carries no image for it. tests/unit/cover.test.ts checks that the two agree. -->
<script id="cover-grain">
window.__riglamGrain=function(strength){
  var T=256,A=42,a=20261017>>>0,f=new Float32Array(T*T),m=0,v=0,i;
  function r(){a=(a+0x6d2b79f5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
  for(i=0;i<f.length;i++){f[i]=(r()+r()+r()+r()+r()+r()-3)*1.4142;m+=f[i]}
  m/=f.length;
  for(i=0;i<f.length;i++){f[i]-=m;v+=f[i]*f[i]}
  var k=A*strength/(Math.sqrt(v/f.length)||1),out=new Uint8ClampedArray(f.length);
  for(i=0;i<f.length;i++)out[i]=Math.round(128+f[i]*k);
  return out;
};
</script>
<script id="cover-draw">
(function(){
  var c=document.getElementById("cover");if(!c)return;
  var GOLD="256,61 371,177 256,292 141,177",BLUE="256,162 400,306 256,451 112,306";
  var ASC=14.35,DEPTH=24.57,LEAD=17.9,NW=90,FW=84,FH=FW*412/312,K0=FW/312,GAP=24,LINE_W=2.5,GRAIN=.55,DIST=80;
  var tile="";
  function grain(){
    if(tile||!window.__riglamGrain)return tile;
    try{
      var g=window.__riglamGrain(GRAIN),cv=document.createElement("canvas"),x=cv.getContext("2d"),im=x.createImageData(256,256);
      for(var i=0;i<g.length;i++){im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=g[i];im.data[i*4+3]=255}
      cv.width=cv.height=256;x.putImageData(im,0,0);tile=cv.toDataURL("image/png");
    }catch(e){}
    return tile;
  }
  function draw(){
    var W=c.clientWidth,H=c.clientHeight,d=window.devicePixelRatio||1,n=function(v){return Math.round(v*d)/d};
    var inset=parseFloat(getComputedStyle(c).paddingBottom)||0;
    // one column, centered in what is above the foot (24 px over it, 96 under), the name 1.8 times its size
    var k=Math.min(1.8,230/NW),block=(ASC+DEPTH)*k,top=(H-72-inset)/2-(FH+GAP+block)/2,baseY=top+FH+GAP+ASC*k;
    var fl=n(W/2-FW/2),ft=n(top),nl=W/2-NW*k/2,nt=baseY-ASC*k,x=W/2;
    var g0=nt-8,g1=nt+block+8,split=ft+FH,tw=256/d/K0;
    var ox=fl-100*K0,oy=ft-50*K0,sh="translate("+((n(ox)-ox)/K0).toFixed(3)+" "+((n(oy)-oy)/K0).toFixed(3)+")";
    var img=grain();
    var line='<svg class="cv-line" width="'+W+'" height="'+H+'" aria-hidden="true"><defs>'
      +'<linearGradient id="cv-lg" gradientUnits="userSpaceOnUse" x1="0" y1="-4" x2="0" y2="'+(H+4)+'"><stop offset="0" stop-color="#000"/><stop offset=".16" stop-color="#fff"/><stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>'
      +'<mask id="cv-lm" maskUnits="userSpaceOnUse" x="0" y="0" width="'+W+'" height="'+H+'"><rect width="'+W+'" height="'+H+'" fill="url(#cv-lg)"/><rect class="cv-gap" y="'+g0+'" width="'+W+'" height="'+(g1-g0)+'" fill="#000"/></mask></defs>'
      +'<g class="cv-ln" mask="url(#cv-lm)"><line x1="'+x+'" y1="-4" x2="'+x+'" y2="'+split+'"/><line class="dots" x1="'+x+'" y1="'+split+'" x2="'+x+'" y2="'+(H+4)+'"/></g></svg>';
    var shape=function(p,fill){return '<polygon points="'+p+'" fill="'+fill+'"/>'+(img?'<polygon class="cv-gr" points="'+p+'" fill="url(#cv-gp)"/>':"")};
    var fig='<svg class="cv-fig" viewBox="100 50 312 412" aria-hidden="true" style="left:'+fl+'px;top:'+ft+'px;width:'+FW+'px;height:'+FH+'px;--d:'+(DIST/K0).toFixed(1)+'px">'
      +'<defs><clipPath id="cv-gc"><polygon points="'+GOLD+'"/></clipPath>'
      +(img?'<pattern id="cv-gp" width="'+tw+'" height="'+tw+'" patternUnits="userSpaceOnUse" patternTransform="'+sh+'"><image href="'+img+'" width="'+tw+'" height="'+tw+'" preserveAspectRatio="none" style="image-rendering:pixelated"/></pattern>':"")+'</defs>'
      +'<g class="d1">'+shape(GOLD,"#faaf3f")+'</g><g class="d2">'+shape(BLUE,"#3155a4")+'</g>'
      +'<g clip-path="url(#cv-gc)"><g class="d3">'+shape(BLUE,"#4c8a63")+'</g></g></svg>';
    var name='<svg class="cv-name" viewBox="0 0 '+NW+' '+(ASC+DEPTH)+'" role="img" aria-label="Riglam practice" style="left:'+nl+'px;top:'+nt+'px;width:'+NW*k+'px;height:'+block+'px">'
      +'<text class="n" x="0" y="'+ASC+'" textLength="'+NW+'" lengthAdjust="spacing">RIGLA<tspan>M</tspan></text>'
      +'<text class="p" x="0" y="'+(ASC+LEAD)+'" textLength="'+NW+'" lengthAdjust="spacing">practic<tspan>e</tspan></text></svg>';
    c.innerHTML=line+fig+name;
    if(!window.__riglamCoverAt)window.__riglamCoverAt=performance.now();
  }
  draw();
  // a turn of the phone before the app is ready: drawn again for the new size (not while it is flying into the roadmap)
  addEventListener("resize",function(){if(c.isConnected&&!c.classList.contains("zm"))draw()});
})();
</script>
